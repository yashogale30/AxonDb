<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AxonDb viewer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #ffffff;
    --ink: #000000;
    --blue: #38b6ff;
    --grey: #6b6b6b;
    --line: #d9d9d9;
    --dot-grid: #cfcfcf;
    --mem-fill: #bdbdbd;
    --mentions-edge: #d4d4d4;
    --similar-edge: #9a9a9a;
    --font: "Schibsted Grotesk", "Helvetica Neue", Arial, sans-serif;
  }

  body.dark-mode {
    --paper: #121212;
    --ink: #f0f0f0;
    --grey: #a0a0a0;
    --line: #333333;
    --dot-grid: #333333;
    --mem-fill: #555555;
    --mentions-edge: #444444;
    --similar-edge: #777777;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: flex;
    font-family: var(--font); font-size: 15px; line-height: 1.45;
    background: var(--paper); color: var(--ink);
    transition: background 0.2s ease, color 0.2s ease;
  }

  /* sidebar */
  #side {
    width: 360px; flex: none; padding: 28px 24px 24px; overflow-y: auto;
    background: var(--paper); border-right: 2px solid var(--ink);
  }
  h1 { font-size: 34px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; margin: 0 0 24px; }
  h2 { font-size: 15px; font-weight: 700; margin: 28px 0 10px; padding-top: 10px; border-top: 1px solid var(--ink); }

  #ask { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 10px 14px; }
  input {
    flex: 1 1 100%; min-width: 0; padding: 8px 0; font: inherit; font-size: 17px;
    color: var(--ink); background: transparent;
    border: 0; border-bottom: 2px solid var(--ink); border-radius: 0; outline: none;
  }
  input::placeholder { color: var(--grey); }
  input:focus { border-bottom-color: var(--blue); box-shadow: 0 2px 0 var(--blue); }
  button { font: inherit; cursor: pointer; }
  button[type="submit"] {
    padding: 9px 18px; border: 2px solid var(--ink); border-radius: 0;
    background: var(--ink); color: var(--paper); font-weight: 700;
  }
  button[type="submit"]:hover { background: var(--blue); color: var(--ink); }
  button.ghost { padding: 9px 0; border: 0; background: none; color: var(--ink); text-decoration: underline; text-underline-offset: 3px; }
  button.ghost:hover { text-decoration-color: var(--blue); text-decoration-thickness: 2px; }
  button:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

  #status { margin-top: 14px; font-size: 14px; color: var(--grey); min-height: 1.4em; }

  #answers { list-style: none; margin: 0; padding: 0; }
  #answers li { margin: 0 0 12px; padding-left: 12px; border-left: 4px solid var(--blue); font-size: 16px; line-height: 1.4; }

  #path { list-style: none; margin: 0; padding: 0; }
  #path li { margin: 0 0 10px; font-size: 14px; line-height: 1.5; }
  .rel { display: inline-block; margin: 0 4px; padding: 0 6px; background: var(--blue); color: #000000; font-size: 12px; font-weight: 700; }

  /* graph */
  #main {
    flex: 1; position: relative; min-width: 0;
    background-image: radial-gradient(circle, var(--dot-grid) 1px, transparent 1.2px);
    background-size: 22px 22px;
  }
  svg { width: 100%; height: 100%; display: block; cursor: grab; }
  svg:active { cursor: grabbing; }
  .name { fill: var(--ink); font: 700 11px var(--font); text-anchor: middle; pointer-events: none;
          paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }
  .rellabel { fill: var(--grey); font: 500 10px var(--font); text-anchor: middle; pointer-events: none;
              paint-order: stroke; stroke: var(--paper); stroke-width: 3px; stroke-linejoin: round; }
  .memlabel { fill: var(--ink); font: 500 11px var(--font); text-anchor: middle; pointer-events: none;
              paint-order: stroke; stroke: var(--paper); stroke-width: 4px; stroke-linejoin: round; }

  #legend {
    position: absolute; left: 16px; bottom: 16px; padding: 8px 12px;
    display: flex; flex-wrap: wrap; gap: 6px 14px; max-width: calc(100% - 32px);
    font-size: 12px; background: var(--paper); border: 1px solid var(--ink);
    color: var(--ink);
  }
  #legend span { display: inline-flex; align-items: center; gap: 5px; }

  @media (max-width: 760px) {
    body { flex-direction: column; }
    #side { width: 100%; max-height: 46vh; border-right: 0; border-bottom: 2px solid var(--ink); }
    #main { min-height: 54vh; }
  }
</style>
</head>
<body>
<div id="side">
  <h1>AxonDb</h1>
  <form id="ask">
    <input id="q" placeholder="Ask something you've stored" autocomplete="off" aria-label="Question">
    <button type="submit">Recall</button>
    <button type="button" id="clear" class="ghost">Clear</button>
    <button type="button" id="theme-toggle" class="ghost">Dark mode</button>
  </form>
  <div id="status" role="status"></div>
  <h2>Answers</h2>
  <ul id="answers"></ul>
  <h2>How it got there</h2>
  <ol id="path"></ol>
</div>
<div id="main">
  <svg id="graph"></svg>
  <div id="legend"></div>
</div>

<script src="d3.min.js"></script>
<script>
const BLUE = "#38b6ff";

const SHAPES = {
  person: d3.symbolCircle, project: d3.symbolSquare, tool: d3.symbolDiamond,
  organization: d3.symbolTriangle, preference: d3.symbolStar, location: d3.symbolWye,
  memory: d3.symbolCircle,
};

const svg = d3.select("#graph");
const root = svg.append("g");
svg.call(d3.zoom().scaleExtent([0.2, 4]).on("zoom", (e) => root.attr("transform", e.transform)));

let nodes = [], links = [], nodeById = new Map();
let nodeSel, linkSel, relSel, nameSel, memSel, sim;
let currentResult = null; // Save recall results to retain state when toggling themes

const isTyped = (d) => d.rel !== "mentions" && d.rel !== "similar_to";
const baseSize = (d) => (d.type === "memory" ? 46 : 280);
const symbolPath = (d, extra = 0) => d3.symbol(SHAPES[d.type] || d3.symbolCircle, baseSize(d) + extra)();
const baseFill = (d) => (d.type === "memory" ? "var(--mem-fill)" : "var(--ink)");
const baseStroke = (d) => (d.rel === "mentions" ? "var(--mentions-edge)" : d.rel === "similar_to" ? "var(--similar-edge)" : "var(--ink)");
const baseWidth = (d) => (isTyped(d) ? 1.6 : 1);
const edgeKey = (a, b, rel) => [a, b].sort().join("|") + "|" + rel;
const linkKey = (d) => edgeKey(d.source.id, d.target.id, d.rel);

function el(tag, text, cls) {
  const node = document.createElement(tag);
  if (text !== undefined) node.textContent = text;
  if (cls) node.className = cls;
  return node;
}

function label(id) {
  if (id === "query") return "your question";
  const n = nodeById.get(id);
  if (!n) return id.slice(0, 8);
  const text = n.type === "memory" ? n.text : n.name;
  return text.length > 48 ? text.slice(0, 45) + "..." : text;
}

function drawLegend() {
  const box = d3.select("#legend");
  box.selectAll("*").remove();
  Object.keys(SHAPES).forEach((type) => {
    const item = box.append("span");
    const isMem = type === "memory";
    item.append("svg").attr("width", 14).attr("height", 14).attr("viewBox", "-7 -7 14 14")
      .style("width", "14px").style("height", "14px").style("cursor", "default")
      .append("path").attr("d", d3.symbol(SHAPES[type], isMem ? 30 : 70)())
      .attr("fill", isMem ? "var(--mem-fill)" : "var(--ink)");
    item.append("span").text(type);
  });
}

function makeDrag() {
  return d3.drag()
    .on("start", (e, d) => { if (!e.active) sim.alphaTarget(0.3).restart(); d.fx = d.x; d.fy = d.y; })
    .on("drag", (e, d) => { d.fx = e.x; d.fy = e.y; })
    .on("end", (e, d) => { if (!e.active) sim.alphaTarget(0); d.fx = null; d.fy = null; });
}

function draw() {
  if (sim) sim.stop();
  root.selectAll("*").remove();
  const w = svg.node().clientWidth, h = svg.node().clientHeight;

  sim = d3.forceSimulation(nodes)
    .force("link", d3.forceLink(links).id((d) => d.id).distance((d) => (d.rel === "mentions" ? 55 : 90)))
    .force("charge", d3.forceManyBody().strength(-170))
    .force("center", d3.forceCenter(w / 2, h / 2))
    .force("collide", d3.forceCollide(16));

  linkSel = root.append("g").selectAll("line").data(links).join("line")
    .attr("stroke", baseStroke).attr("stroke-width", baseWidth)
    .attr("stroke-dasharray", (d) => (d.rel === "similar_to" ? "4 3" : null));

  relSel = root.append("g").selectAll("text").data(links.filter(isTyped)).join("text")
    .attr("class", "rellabel").text((d) => d.rel.replace(/_/g, " "));

  nodeSel = root.append("g").selectAll("path").data(nodes).join("path")
    .attr("d", (d) => symbolPath(d))
    .attr("fill", baseFill)
    .attr("stroke", "var(--paper)").attr("stroke-width", 1.5)
    .style("cursor", "grab")
    .call(makeDrag());
  nodeSel.append("title").text((d) => (d.type === "memory" ? d.text : d.name + " (" + d.type + ")"));

  nameSel = root.append("g").selectAll("text").data(nodes.filter((d) => d.type !== "memory")).join("text")
    .attr("class", "name").text((d) => d.name);
  memSel = root.append("g").selectAll("text").data(nodes.filter((d) => d.type === "memory")).join("text")
    .attr("class", "memlabel").attr("opacity", 0)
    .text((d) => (d.text.length > 44 ? d.text.slice(0, 41) + "..." : d.text));

  sim.on("tick", () => {
    linkSel.attr("x1", (d) => d.source.x).attr("y1", (d) => d.source.y)
      .attr("x2", (d) => d.target.x).attr("y2", (d) => d.target.y);
    relSel.attr("x", (d) => (d.source.x + d.target.x) / 2).attr("y", (d) => (d.source.y + d.target.y) / 2 - 3);
    nodeSel.attr("transform", (d) => "translate(" + d.x + "," + d.y + ")");
    nameSel.attr("x", (d) => d.x).attr("y", (d) => d.y - 17);
    memSel.attr("x", (d) => d.x).attr("y", (d) => d.y + 20);
  });
}

function clearPanel() {
  document.getElementById("answers").textContent = "";
  document.getElementById("path").textContent = "";
  document.getElementById("status").textContent = "";
}

function resetView() {
  currentResult = null;
  nodeSel.attr("opacity", 1).attr("fill", baseFill).attr("stroke", "var(--paper)").attr("stroke-width", 1.5)
    .attr("d", (d) => symbolPath(d));
  linkSel.attr("opacity", 1).attr("stroke", baseStroke).attr("stroke-width", baseWidth);
  relSel.attr("opacity", 1);
  nameSel.attr("opacity", 1);
  memSel.attr("opacity", 0);
  clearPanel();
}

function showResult(data) {
  currentResult = data;
  clearPanel();
  if (!data.answers.length) {
    document.getElementById("status").textContent = "Nothing stored that matches. Try different words.";
    return;
  }

  const answerIds = new Set(data.answers.map((a) => a.id));
  const linkedIds = new Set();
  const pathNodes = new Set(answerIds);
  const pathEdges = new Set();
  data.path.forEach((s) => {
    if (s.src !== "query") pathNodes.add(s.src);
    pathNodes.add(s.dst);
    if (s.rel === "linked") linkedIds.add(s.dst);
    pathEdges.add(edgeKey(s.src, s.dst, s.rel));
  });

  nodeSel
    .attr("opacity", (d) => (pathNodes.has(d.id) ? 1 : 0.12))
    .attr("fill", (d) => (answerIds.has(d.id) ? BLUE : baseFill(d)))
    .attr("stroke", (d) => (answerIds.has(d.id) ? "var(--ink)" : linkedIds.has(d.id) ? BLUE : "var(--paper)"))
    .attr("stroke-width", (d) => (answerIds.has(d.id) ? 2.5 : linkedIds.has(d.id) ? 3 : 1.5))
    .attr("d", (d) => symbolPath(d, answerIds.has(d.id) ? 160 : 0));
  linkSel
    .attr("opacity", (d) => (pathEdges.has(linkKey(d)) ? 1 : 0.08))
    .attr("stroke", (d) => (pathEdges.has(linkKey(d)) ? BLUE : baseStroke(d)))
    .attr("stroke-width", (d) => (pathEdges.has(linkKey(d)) ? 4 : baseWidth(d)));
  relSel.attr("opacity", (d) => (pathEdges.has(linkKey(d)) ? 1 : 0.08));
  nameSel.attr("opacity", (d) => (pathNodes.has(d.id) ? 1 : 0.15));
  memSel.attr("opacity", (d) => (answerIds.has(d.id) ? 1 : 0));

  const answers = document.getElementById("answers");
  data.answers.forEach((a) => answers.appendChild(el("li", a.text)));

  const path = document.getElementById("path");
  data.path.forEach((s) => {
    const li = el("li");
    li.appendChild(el("span", label(s.src)));
    li.appendChild(el("span", s.rel + " " + s.score.toFixed(2), "rel"));
    li.appendChild(el("span", label(s.dst)));
    path.appendChild(li);
  });
}

async function load() {
  const status = document.getElementById("status");
  status.textContent = "Loading graph...";
  const data = await (await fetch("/graph")).json();
  nodes = data.nodes.map((n) => ({ ...n }));
  nodeById = new Map(nodes.map((n) => [n.id, n]));
  links = data.edges
    .filter((e) => nodeById.has(e.src) && nodeById.has(e.dst))
    .map((e) => ({ source: e.src, target: e.dst, rel: e.rel, id: e.id }));
  draw();
  drawLegend();
  status.textContent = nodes.length + " nodes, " + links.length + " edges";
}

document.getElementById("ask").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const q = document.getElementById("q").value.trim();
  if (!q) return;
  const status = document.getElementById("status");
  status.textContent = "Searching...";
  const res = await fetch("/recall?q=" + encodeURIComponent(q));
  if (!res.ok) {
    status.textContent = "The search failed. Check the terminal where the server runs.";
    return;
  }
  showResult(await res.json());
});

document.getElementById("clear").addEventListener("click", () => {
  document.getElementById("q").value = "";
  resetView();
  document.getElementById("status").textContent = nodes.length + " nodes, " + links.length + " edges";
});

document.getElementById("theme-toggle").addEventListener("click", () => {
  const isDark = document.body.classList.toggle("dark-mode");
  document.getElementById("theme-toggle").textContent = isDark ? "Light mode" : "Dark mode";
  drawLegend();
  if (currentResult) {
    showResult(currentResult);
  } else {
    resetView();
  }
});

load();
</script>
</body>
</html>
